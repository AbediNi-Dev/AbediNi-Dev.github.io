<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آزمون جامع هوشمند نما</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <style>
        :root {
            --primary: #bc6c4d;
            --primary-light: #f4ece6;
            --text-dark: #4a4441;
            --text-gray: #7a7471;
            --bg: #f9f7f2;
            --border: #e2ddd9;
            --radius: 16px;
        }
        body.dark-mode {
            --primary: #d4a373;
            --primary-light: #3d3532;
            --text-dark: #f1ebe7;
            --text-gray: #b5ada8;
            --bg: #1c1917;
            --border: #44403c;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: var(--bg);
            color: var(--text-dark);
            line-height: 1.6;
            padding-bottom: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: all 0.4s ease;
        }
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 20px;
            background: var(--bg);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border);
        }
        .logo { font-weight: 900; font-size: 1.5rem; color: var(--primary); }
        .icon-btn {
            width: 40px; height: 40px; border: 1px solid var(--border);
            border-radius: 12px; display: flex; align-items: center;
            justify-content: center; color: var(--primary); background: var(--bg);
            cursor: pointer;
        }
        .hero { padding: 20px; text-align: center; flex: 1; }
        .quiz-container { max-width: 700px; margin: 0 auto; padding: 0 20px; }
        .question-card {
            border: 1px solid var(--border); border-radius: 20px;
            padding: 25px; background: var(--bg); margin-bottom: 20px;
        }
        .question-header { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        .question-number {
            background: var(--primary-light); color: var(--primary);
            padding: 8px 16px; border-radius: 20px; font-weight: bold;
        }
        .question-text { font-size: 1.15rem; font-weight: 700; color: var(--text-dark); text-align: right; }
        .options-grid { display: grid; gap: 10px; margin-top: 20px; }
        .option {
            padding: 15px; border: 1px solid var(--border);
            border-radius: 12px; cursor: pointer; transition: 0.3s;
            background: var(--bg); text-align: right;
        }
        .option:hover { border-color: var(--primary); background: var(--primary-light); }
        .option.selected { background: var(--primary); color: white; border-color: var(--primary); }
        .progress-bar { width: 100%; height: 8px; background: var(--primary-light); border-radius: 10px; margin-bottom: 20px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--primary); width: 0%; transition: 0.4s; }
        .btn {
            padding: 12px 30px; border-radius: 12px; font-weight: bold;
            cursor: pointer; transition: 0.2s; border: none; width: 100%;
        }
        .btn-primary { background-color: var(--primary); color: white; }
        .results-card {
            text-align: center; padding: 40px 20px; border-radius: 20px;
            border: 2px solid var(--primary); background: var(--primary-light);
        }
        .score-circle {
            width: 120px; height: 120px; border-radius: 50%;
            background: var(--primary); margin: 0 auto 20px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.8rem; font-weight: 900; color: white;
        }
        footer { margin-top: auto; padding: 20px; text-align: center; border-top: 1px solid var(--border); font-size: 0.8rem; }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="icon-btn" style="border:none;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </a>
        <div class="logo">هوشمند نما</div>
        <div class="icon-btn" id="themeToggle">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </div>
    </header>

    <main class="hero">
        <div class="quiz-container">
            <div id="intro">
                <h1>آزمون جامع سطح‌بندی</h1>
                <p>۱۰ سوال تصادفی از بانک ۵۰ سوالی هوشمند نما</p>
                <button onclick="startQuiz()" class="btn btn-primary" style="margin-top:20px">شروع آزمون</button>
            </div>

            <div id="quiz" style="display:none">
                <div class="progress-bar"><div class="progress-fill" id="fill"></div></div>
                <div id="questionBox"></div>
                <button id="nextBtn" onclick="next()" disabled class="btn btn-primary">تایید و بعدی</button>
            </div>

            <div id="result" style="display:none" class="results-card">
                <div class="score-circle" id="finalScore"></div>
                <h2 id="msg"></h2>
                <div style="margin-top:20px">
                    <button onclick="location.reload()" class="btn btn-primary">آزمون مجدد</button>
                </div>
            </div>
        </div>
    </main>

    <script>
        const bank = [
            {q:"اولین قدم برای واکاوی یک پیام رسانه‌ای چیست؟",o:["پذیرش محتوا","شناسایی فرستنده و هدف","ارسال برای دیگران","لایک کردن"],c:1},
            {q:"کدام یک از نشانه‌های ایمیل فیشینگ است؟",o:["نام فرستنده رسمی","غلط املایی و فوریت کاذب","تاریخ دقیق","متن طولانی"],c:1},
            {q:"امن‌ترین روش برای قفل گوشی چیست؟",o:["الگوی ساده","رمز عددی ۴ رقمی","تشخیص چهره/اثر انگشت معتبر","بدون قفل"],c:2},
            {q:"منظور از اتاق پژواک (Echo Chamber) چیست؟",o:["اتاق ضبط صدا","تکرار عقاید مشابه در فضای مجازی","سرعت بالای اینترنت","نویز رسانه‌ای"],c:1},
            {q:"HTTPS نشانه چیست؟",o:["سرعت بالا","امنیت و رمزنگاری تبادل داده","سایت دولتی","سایت خارجی"],c:1},
            {q:"دیپ‌فیک (Deepfake) از کدام ابزار استفاده می‌کند؟",o:["فتوشاپ","هوش مصنوعی و یادگیری عمیق","نقاشی دیجیتال","تدوین دستی"],c:1},
            {q:"در صورت مشاهده آزار سایبری اولین اقدام چیست؟",o:["پاسخ تند","بلاک و گزارش دادن","سکوت همیشگی","حذف اکانت"],c:1},
            {q:"کدام رمز عبور قوی‌تر است؟",o:["123456","Admin123","H#9k!m2@Pz","MyName2024"],c:2},
            {q:"ردپای دیجیتال شامل چه مواردی است؟",o:["فقط عکس‌ها","تمامی فعالیت‌های آنلاین ثبت شده","فقط ایمیل‌ها","تعداد فالوور"],c:1},
            {q:"هدف اصلی مهندسی اجتماعی چیست؟",o:["هک سخت‌افزاری","فریب انسان برای لو دادن اطلاعات","کاهش سرعت سایت","نصب ویندوز"],c:1},
            {q:"چرا نباید از وای‌فای عمومی برای بانکی استفاده کرد؟",o:["سرعت کم است","احتمال شنود اطلاعات وجود دارد","هزینه بالایی دارد","باعث داغی گوشی می‌شود"],c:1},
            {q:"منظور از سواد رسانه‌ای چیست؟",o:["فقط خواندن خبر","توانایی تحلیل و تولید آگاهانه پیام","داشتن گوشی هوشمند","عضویت در شبکه‌ها"],c:1},
            {q:"کدام یک 'خبر جعلی' محسوب می‌شود؟",o:["تحلیل شخصی","شایعه‌ای که به عنوان واقعیت نشر یابد","خبر قدیمی","نقد فیلم"],c:1},
            {q:"تایید دو مرحله‌ای (2FA) چه مزیتی دارد؟",o:["ورود سریع‌تر","امنیت دوچندان حساب کاربری","ذخیره حجم اینترنت","زیبایی پروفایل"],c:1},
            {q:"حق کپی‌رایت یعنی چه؟",o:["حق کپی کردن آزاد","حق مالکیت معنوی پدیدآورنده","اجبار به اشتراک‌گذاری","حذف نام نویسنده"],c:1},
            {q:"یک 'بات' (Bot) در فضای مجازی چه می‌کند؟",o:["فقط چت می‌کند","انجام خودکار وظایف برنامه‌ریزی شده","تعمیر سخت‌افزار","خاموش کردن سرور"],c:1},
            {q:"نشانه اصلی یک سایت فیشینگ در آدرس‌بار چیست؟",o:["رنگ سبز","تغییر جزئی در حروف دامنه","لوگوی سایت","فونت درشت"],c:1},
            {q:"منظور از حریم خصوصی دیجیتال چیست؟",o:["نشان دادن همه چیز","کنترل فرد بر اطلاعات شخصی خود","بستن اینترنت","نداشتن پروفایل"],c:1},
            {q:"کلیک‌بیت (Clickbait) به چه معناست؟",o:["نرم‌افزار کلیک","تیتر فریبنده برای جذب کلیک","سرعت ماوس","بازی رایانه‌ای"],c:1},
            {q:"کدام ابزار برای راستی‌آزمایی عکس بهتر است؟",o:["اینستاگرام","جستجوی معکوس گوگل","تلگرام","واتس‌اپ"],c:1},
            {q:"هوش مصنوعی مولد چیست؟",o:["ماشین حساب","سیستمی که محتوای جدید تولید می‌کند","روبات فیزیکی","تلویزیون هوشمند"],c:1},
            {q:"منظور از فایروال (Firewall) چیست؟",o:["دیوار آتشین فیزیکی","سد دفاعی در برابر دسترسی غیرمجاز","کپسول آتش‌نشانی","آنتی‌ویروس گوشی"],c:1},
            {q:"بدافزار (Malware) مخفف چیست؟",o:["سخت‌افزار مخرب","نرم‌افزار مخرب","ایمیل تبلیغاتی","بازی آنلاین"],c:1},
            {q:"اسکم (Scam) به چه معناست؟",o:["پیام تبریک","کلاهبرداری و فریب آنلاین","بروزرسانی سیستم","ذخیره سازی"],c:1},
            {q:"در مواجهه با خبر شوکه‌کننده چه باید کرد؟",o:["ارسال فوری","صبر و بررسی منابع معتبر","بستن برنامه","لایک کردن"],c:1},
            {q:"منظور از 'اورکات' در امنیت چیست؟",o:["نام یک هکر","دسترسی از راه دور به سیستم","یک شبکه قدیمی","نام آنتی ویروس"],c:1},
            {q:"کوکی‌ها در مرورگر چه وظیفه‌ای دارند؟",o:["پاک کردن حافظه","ذخیره تنظیمات و اطلاعات ورود کاربر","افزایش سرعت پردازنده","خنک کردن سیستم"],c:1},
            {q:"یک شهروند دیجیتال مسئول کیست؟",o:["کسی که زیاد پست می‌گذارد","کسی که اخلاق را در فضای مجازی رعایت می‌کند","کسی که هکر است","کسی که فقط تماشا می‌کند"],c:1},
            {q:"وی‌پی‌ان (VPN) چه ریسک امنیتی می‌تواند داشته باشد؟",o:["هیچ ریسکی ندارد","دسترسی سرور وی‌پی‌ان به داده‌های شما","کندی ویندوز","تموم شدن شارژ"],c:1},
            {q:"فیشینگ تلفنی چه نام دارد؟",o:["اسمیشینگ","ویشینگ","ایمیلینگ","کالینگ"],c:1},
            {q:"بهترین راه برای جلوگیری از نفوذ به مودم چیست؟",o:["خاموش کردن شبانه","تغییر رمز پیش‌فرض و پروتکل WPA3","برداشتن آنتن","گذاشتن زیر جعبه"],c:1},
            {q:"منظور از بایوس (BIOS) در امنیت چیست؟",o:["اولین سطح نرم‌افزاری راه‌اندازی","نام یک ویروس","نرم‌افزار چت","شرکت سازنده"],c:0},
            {q:"تفکر الگوریتمی در رسانه یعنی چه؟",o:["حل ریاضی","درک نحوه اولویت‌بندی محتوا توسط سیستم","برنامه‌نویسی سخت","خرید آنلاین"],c:1},
            {q:"بلاک‌چین در امنیت چه کاربردی دارد؟",o:["ساخت عکس","تامین امنیت و شفافیت داده‌های توزیع شده","بازی سازی","نصب ویندوز"],c:1},
            {q:"اسمیشینگ (Smishing) حمله از طریق چیست؟",o:["ایمیل","پیامک (SMS)","تماس تصویری","فکس"],c:1},
            {q:"چرا اخبار جعلی سریع‌تر پخش می‌شوند؟",o:["چون علمی هستند","چون بر احساسات سوار می‌شوند","چون گران هستند","چون کوتاه هستند"],c:1},
            {q:"قانون '۱۰ ثانیه مکث' برای چیست؟",o:["شارژ گوشی","جلوگیری از واکنش هیجانی به اخبار","سرعت اینترنت","اجرای بازی"],c:1},
            {q:"نرم‌افزار متن‌باز (Open Source) یعنی چه؟",o:["نرم‌افزار رایگان","نرم‌افزاری که کد آن در دسترس عموم است","نرم‌افزار بدون امنیت","فقط برای لینوکس"],c:1},
            {q:"منظور از سواد بصری چیست؟",o:["خوب دیدن","توانایی تحلیل تصاویر و نشانه‌ها","عکاسی حرفه‌ای","خرید دوربین"],c:1},
            {q:"پاپ‌آپ (Pop-up) های مزاحم نشانه چیست؟",o:["جایزه","احتمال وجود بدافزار تبلیغاتی","سرعت بالا","بروزرسانی"],c:1},
            {q:"امن‌ترین راه برای دانلود اپلیکیشن چیست؟",o:["سایت‌های متفرقه","فروشگاه‌های رسمی (مثل Google Play)","ارسال از طریق بلوتوث","کانال‌های تلگرامی"],c:1},
            {q:"جاسوس‌افزار (Spyware) چه هدفی دارد؟",o:["کمک به کاربر","سرقت اطلاعات و نظارت مخفیانه","زیبایی ویندوز","افزایش رم"],c:1},
            {q:"منظور از اینترنت اشیا (IoT) چیست؟",o:["فقط کامپیوترها","اتصال وسایل فیزیکی به اینترنت","اینترنت پرسرعت","کابل کشی"],c:1},
            {q:"بیت‌کوین چه ارتباطی با باج‌افزار دارد؟",o:["هیچ","واحد پرداخت درخواستی مجرمان سایبری","نام یک آنتی ویروس","شرکت امنیتی"],c:1},
            {q:"اعتبارسنجی منبع یعنی چه؟",o:["خرید اکانت","بررسی تخصص و سابقه منتشر کننده خبر","لایک زیاد","فالوور بالا"],c:1},
            {q:"منظور از سواد خبری چیست؟",o:["روزنامه خواندن","تشخیص تفاوت بین واقعیت، نظر و تبلیغ","نوشتن مقاله","خبرنگاری"],c:1},
            {q:"بهره‌کشی از کودکان در فضای مجازی چه نام دارد؟",o:["فیشینگ","گرومینگ (Grooming)","اسپم","هک"],c:1},
            {q:"چرا اشتراک‌گذاری مکان لحظه‌ای خطرناک است؟",o:["شارژ کم می‌شود","سوءاستفاده افراد از غیبت شما در منزل","کندی گوشی","تبلیغات"],c:1},
            {q:"تکنیک 'برش انتخابی' در رسانه چیست؟",o:["سانسور کامل","نمایش بخشی از واقعیت برای تغییر کل مفهوم","چسباندن عکس","فتوشاپ"],c:1},
            {q:"هدف از ایجاد هوشمند نما چیست؟",o:["بازی","ارتقای سواد رسانه و امنیت نوجوانان","فروش گوشی","تبلیغات"],c:1}
        ];

        let selectedQ = [], current = 0, score = 0, userAns = null;

        function startQuiz() {
            selectedQ = bank.sort(() => 0.5 - Math.random()).slice(0, 10);
            document.getElementById('intro').style.display = 'none';
            document.getElementById('quiz').style.display = 'block';
            render();
        }

        function render() {
            const q = selectedQ[current];
            document.getElementById('fill').style.width = (current * 10) + '%';
            document.getElementById('questionBox').innerHTML = `
                <div class="question-card">
                    <div class="question-header"><span class="question-number">سوال ${current+1}</span></div>
                    <p class="question-text">${q.q}</p>
                    <div class="options-grid">
                        ${q.o.map((o,i) => `<div class="option" onclick="pick(${i})">${o}</div>`).join('')}
                    </div>
                </div>`;
            document.getElementById('nextBtn').disabled = true;
            userAns = null;
        }

        function pick(i) {
            userAns = i;
            document.querySelectorAll('.option').forEach((el,idx) => el.classList.toggle('selected', idx === i));
            document.getElementById('nextBtn').disabled = false;
        }

        function next() {
            if(userAns === selectedQ[current].c) score++;
            current++;
            if(current < 10) render(); else showResult();
        }

        function showResult() {
            document.getElementById('quiz').style.display = 'none';
            document.getElementById('result').style.display = 'block';
            document.getElementById('finalScore').innerText = (score * 10) + '%';
            document.getElementById('msg').innerText = score >= 7 ? "سطح شما: عالی" : "سطح شما: نیاز به آموزش";
        }

        document.getElementById('themeToggle').onclick = () => {
            document.body.classList.toggle('dark-mode');
        }
    </script>
</body>
</html>
