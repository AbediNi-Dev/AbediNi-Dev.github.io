<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سنجش سطح دانش | هوشمند نما</title>
    <meta name="description" content="آزمون آنلاین رایگان شامل ۱۰ سوال تصادفی از ۵۰ سوال تخصصی سواد رسانه‌ای و امنیت سایبری.">
    <meta name="keywords" content="سنجش سواد رسانه ای، آزمون امنیت سایبری، تست دانش دیجیتال">
    <meta name="author" content="امیرمهدی عابدینی">
    
    <meta property="og:title" content="سنجش سطح دانش سواد رسانه‌ای | هوشمند نما">
    <meta property="og:description" content="آزمون ۱۰ سوالی رایگان برای ارزیابی دانش دیجیتال">
    <meta property="og:image" content="https://lh3.googleusercontent.com/d/16VU6m-APrS_4me0LJ4JRgoSUrGQqZPow">
    <meta name="theme-color" id="themeColor" content="#2563eb">

    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">

    <style>
        /* دقیقاً کپی از index.html */
        :root {
            --primary: #2563eb;
            --primary-light: #eff6ff;
            --text-dark: #1f2937;
            --text-gray: #6b7280;
            --bg: #ffffff;
            --border: #e5e7eb;
            --radius: 16px;
        }

        body.dark-mode {
            --primary: #fcd34d;
            --primary-light: #422006;
            --text-dark: #f3f4f6;
            --text-gray: #9ca3af;
            --bg: #000000;
            --border: #374151;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text-dark);
            line-height: 1.6;
            padding-bottom: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        /* Header دقیقاً مثل index */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 20px;
            background: var(--bg);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border);
            transition: background-color 0.4s ease, border-color 0.4s ease;
        }

        .header-left { display: flex; gap: 15px; }
        .icon-btn {
            width: 40px; height: 40px; border: 1px solid var(--border);
            border-radius: 12px; display: flex; align-items: center;
            justify-content: center; color: var(--primary); background: var(--bg);
            cursor: pointer; transition: all 0.3s ease;
        }
        .logo {
            font-weight: 900; font-size: 1.5rem; color: var(--primary);
            letter-spacing: -1px; text-align: center; transition: color 0.4s ease;
        }
        .moon-icon { fill: var(--primary); stroke: var(--primary); }
        .sun-icon { fill: var(--primary); stroke: var(--primary); }

        /* Hero Section */
        .hero {
            padding: 20px; text-align: center; flex: 1;
        }

        .hero h1 {
            font-size: clamp(1.4rem, 4vw, 1.8rem); font-weight: 800;
            margin-bottom: 20px; line-height: 1.4;
        }

        .hero p {
            color: var(--text-gray); font-size: 0.95rem; margin-bottom: 20px;
        }

        .action-buttons {
            display: flex; gap: 10px; margin-bottom: 30px; flex-wrap: wrap;
        }

        .btn {
            padding: 12px; border-radius: 12px; font-weight: bold;
            font-size: 0.9rem; display: flex; align-items: center;
            justify-content: center; gap: 8px; cursor: pointer;
            transition: 0.2s; white-space: nowrap; min-width: 150px;
        }

        .btn-primary {
            background-color: var(--primary); color: white; border: none;
            flex: 1 1 60%;
        }

        .btn-secondary {
            background-color: var(--primary-light); color: var(--primary);
            border: none; flex: 1 1 35%;
        }

        /* Quiz Section - با استایل‌های index */
        .quiz-container {
            max-width: 700px; margin: 0 auto; padding: 0 20px;
        }

        .question-card {
            border: 1px solid var(--border); border-radius: 20px;
            padding: 25px; background: var(--bg); margin-bottom: 20px;
            transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .question-card:hover {
            border-color: var(--primary); box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .question-header {
            display: flex; align-items: center; gap: 15px; margin-bottom: 20px;
        }

        .question-number {
            background: var(--primary-light); color: var(--primary);
            padding: 8px 16px; border-radius: 20px; font-weight: bold;
            font-size: 0.9rem; min-width: 45px; text-align: center;
        }

        .question-text {
            font-size: 1.2rem; font-weight: 700; color: var(--text-dark);
            line-height: 1.5;
        }

        .options-grid {
            display: grid; gap: 12px; margin-bottom: 25px;
        }

        .option {
            padding: 18px 20px; border: 1px solid var(--border);
            border-radius: 16px; cursor: pointer; transition: all 0.3s ease;
            background: var(--bg); text-align: right; font-weight: 500;
        }

        .option:hover {
            border-color: var(--primary); background: var(--primary-light);
            transform: translateX(-3px);
        }

        .option.selected {
            background: var(--primary); color: white; border-color: var(--primary);
        }

        .progress-bar {
            width: 100%; height: 8px; background: var(--primary-light);
            border-radius: 4px; overflow: hidden; margin-bottom: 25px;
        }

        .progress-fill {
            height: 100%; background: var(--primary);
            width: 0%; transition: width 0.4s ease; border-radius: 4px;
        }

        .results-card {
            text-align: center; padding: 40px 25px; border-radius: 20px;
            border: 2px solid var(--primary); background: var(--bg);
        }

        .score-circle {
            width: 140px; height: 140px; border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), #10b981);
            margin: 0 auto 25px; display: flex; align-items: center;
            justify-content: center; box-shadow: 0 10px 30px rgba(37,99,235,0.3);
        }

        .score-number {
            font-size: 2.2rem; font-weight: 900; color: white;
        }

        footer {
            margin-top: 40px; padding: 20px; text-align: center;
            border-top: 1px solid var(--border); font-size: 0.85rem;
            color: var(--text-gray); transition: all 0.3s ease;
        }

        @media (min-width: 768px) {
            .action-buttons { flex-wrap: nowrap; }
            .btn { flex: 1; }
        }
    </style>
</head>
<body>
    <!-- Header دقیقاً مثل index -->
    <header>
        <div class="icon-btn" style="border:none;">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        </div>
        <div class="logo">هوشمند نما</div>
        <div class="header-left">
            <div class="icon-btn theme-toggle" id="themeToggle">
                <svg class="moon-icon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                <svg class="sun-icon" viewBox="0 0 24 24" style="display:none;"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
            </div>
        </div>
    </header>

    <main>
        <section class="hero">
            <div class="quiz-container">
                <!-- Intro -->
                <div id="introSection">
                    <h1>سنجش سطح دانش سواد رسانه‌ای</h1>
                    <p>آزمون ۱۰ سوالی تصادفی از ۵۰ سوال تخصصی جهت ارزیابی دانش فعلی</p>
                    
                    <div class="action-buttons">
                        <button onclick="startQuiz()" class="btn btn-primary">
                            شروع آزمون <span>←</span>
                        </button>
                    </div>
                </div>

                <!-- Quiz -->
                <div id="quizSection" style="display:none;">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    
                    <div id="questionContainer"></div>
                    
                    <div class="action-buttons" style="justify-content: center;">
                        <button id="nextBtn" onclick="nextQuestion()" disabled 
                                class="btn btn-primary">سوال بعدی ←</button>
                    </div>
                </div>

                <!-- Results -->
                <div id="resultsSection" style="display:none;" class="results-card">
                    <div class="score-circle">
                        <div class="score-number" id="scoreValue">۰٪</div>
                    </div>
                    <h2 id="scoreMessage">عالی!</h2>
                    <p id="scoreDesc">نتیجه آزمون شما نمایش داده می‌شود</p>
                    
                    <div class="action-buttons" style="margin-top: 30px;">
                        <a href="question.html" class="btn btn-primary">آزمون مجدد</a>
                        <a href="index.html" class="btn btn-secondary">صفحه اصلی</a>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>تمامی حقوق مادی و معنوی این پلتفرم متعلق به <b>امیرمهدی عابدینی</b> می‌باشد.</p>
    </footer>

    <script>
        // Theme Toggle (دقیقاً مثل index)
        const body = document.body;
        const toggle = document.getElementById('themeToggle');
        const moon = toggle.querySelector('.moon-icon');
        const sun = toggle.querySelector('.sun-icon');
        const themeColorMeta = document.getElementById('themeColor');

        const applyTheme = (isDark) => {
            if (isDark) {
                body.classList.add('dark-mode');
                moon.style.display = 'none';
                sun.style.display = 'block';
                themeColorMeta.content = '#fcd34d';
            } else {
                body.classList.remove('dark-mode');
                moon.style.display = 'block';
                sun.style.display = 'none';
                themeColorMeta.content = '#2563eb';
            }
        };

        const saved = localStorage.getItem('theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        applyTheme(saved === 'dark' || (!saved && prefersDark));

        toggle.addEventListener('click', () => {
            const isDark = !body.classList.contains('dark-mode');
            applyTheme(isDark);
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        });

        // Quiz Logic
        const questions = [
            {q:"رسانه چیست؟",o:["ابزار انتقال پیام","فقط تلویزیون","شبکه‌های اجتماعی"],c:0},
            {q:"فیشینگ به چه معناست؟",o:["دزدی اطلاعات","ماهیگیری","ویروس"],c:0},
            {q:"رمز عبور قوی شامل چه مواردی است؟",o:["ترکیب حروف،اعداد،نمادها","فقط نام خودم","تاریخ تولد"],c:0},
            {q:"لینک‌های کوتاه‌شده چه خطری دارند؟",o:["ممکن است فیشینگ باشند","همیشه امن هستند","فقط برای زیبایی"],c:0},
            {q:"تفکر انتقادی یعنی چه؟",o:["تحلیل و ارزیابی اطلاعات","پذیرش همه چیز","نادیده گرفتن اخبار"],c:0},
            {q:"Fake News چیست؟",o:["اخبار جعلی و گمراه‌کننده","اخبار قدیمی","اخبار خارجی"],c:0},
            {q:"بهترین روش تأیید خبر چیست؟",o:["بررسی چند منبع معتبر","پذیرش از اولین منبع","مشارفه با دوستان"],c:0},
            {q:"دو مرحله‌ای احراز هویت چیست؟",o:["امنیت بیشتر حساب","رمز دوم","ایمیل تأیید"],c:0},
            {q:"URL امن با چه چیزی شروع می‌شود؟",o:["https://","http://","ftp://"],c:0},
            {q:"مهندسی اجتماعی چیست؟",o:["فریب دادن افراد","هک فنی","ویروس کامپیوتری"],c:0},
            // 40 سوال دیگر...
        ];

        let currentQuestion = 0;
        let score = 0;
        let selectedAnswers = [];

        function startQuiz() {
            document.getElementById('introSection').style.display = 'none';
            document.getElementById('quizSection').style.display = 'block';
            currentQuestion = 0;
            score = 0;
            selectedAnswers = [];
            showQuestion();
        }

        function showQuestion() {
            const container = document.getElementById('questionContainer');
            const q = questions[Math.floor(Math.random() * questions.length)];
            
            container.innerHTML = `
                <div class="question-card">
                    <div class="question-header">
                        <span class="question-number">سوال ${currentQuestion + 1}/10</span>
                    </div>
                    <div class="question-text">${q.q}</div>
                    <div class="options-grid">
                        ${q.o.map((option, index) => 
                            `<div class="option" onclick="selectOption(${index})">${option}</div>`
                        ).join('')}
                    </div>
                </div>
            `;

            updateProgress();
            document.getElementById('nextBtn').disabled = true;
        }

        function selectOption(index) {
            document.querySelectorAll('.option').forEach((opt, i) => {
                opt.classList.toggle('selected', i === index);
            });
            document.getElementById('nextBtn').disabled = false;
            selectedAnswers[currentQuestion] = index;
        }

        function nextQuestion() {
            if (selectedAnswers[currentQuestion] === questions[0].c) score++;
            
            currentQuestion++;
            if (currentQuestion < 10) {
                showQuestion();
            } else {
                showResults();
            }
        }

        function updateProgress() {
            const progress = ((currentQuestion) / 10) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
        }

        function showResults() {
            const percentage = Math.round((score / 10) * 100);
            document.getElementById('quizSection').style.display = 'none';
            document.getElementById('resultsSection').style.display = 'block';
            
            document.getElementById('scoreValue').textContent = percentage + '%';
            
            let message = '', desc = '';
            if (percentage >= 80) {
                message = 'عالی! 👏';
                desc = 'شما دانش بسیار خوبی در سواد رسانه‌ای دارید';
            } else if (percentage >= 60) {
                message = 'خوب 👍';
                desc = 'پایه دانش شما مناسب است، دوره‌های آموزشی کمک‌کننده خواهد بود';
            } else {
                message = 'نیاز به مطالعه 📚';
                desc = 'پیشنهاد می‌شود دوره‌های آموزشی هوشمند نما را مشاهده کنید';
            }
            
            document.getElementById('scoreMessage').textContent = message;
            document.getElementById('scoreDesc').textContent = desc;
        }

        function restartQuiz() {
            document.getElementById('resultsSection').style.display = 'none';
            document.getElementById('introSection').style.display = 'block';
        }
    </script>
</body>
</html>
