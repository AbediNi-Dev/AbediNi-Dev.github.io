let selectedQuestions = [];
let currentIdx = 0;
let score = 0;
let selectedAnswer = null;
const htmlEl = document.documentElement;
const themeToggle = document.getElementById('themeToggle');
const moonIcon = document.querySelector('.moon-icon');
const sunIcon = document.querySelector('.sun-icon');
const themeColorMeta = document.getElementById('themeColor');
const saved = localStorage.getItem('theme');
const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
let isDark = saved === 'dark' || (!saved && prefersDark);
function applyTheme(dark) {
if (dark) {
htmlEl.classList.add('dark');
htmlEl.classList.remove('light');
moonIcon.classList.add('hidden');
sunIcon.classList.remove('hidden');
sunIcon.classList.add('block');
if (themeColorMeta) themeColorMeta.content = '#d4a373';
themeToggle.setAttribute('aria-label', 'فعال‌سازی حالت روز');
} else {
htmlEl.classList.remove('dark');
htmlEl.classList.add('light');
moonIcon.classList.remove('hidden');
sunIcon.classList.add('hidden');
sunIcon.classList.remove('block');
if (themeColorMeta) themeColorMeta.content = '#bc6c4d';
themeToggle.setAttribute('aria-label', 'فعال‌سازی حالت شب');
}
}
applyTheme(isDark);
themeToggle.addEventListener('click', function () {
isDark = !isDark;
localStorage.setItem('theme', isDark ? 'dark' : 'light');
applyTheme(isDark);
});
function startQuiz() {
selectedQuestions = bank.sort(() => 0.5 - Math.random()).slice(0, 10);
document.getElementById('intro-screen').style.display = 'none';
document.getElementById('quiz-screen').style.display = 'block';
renderQuestion();
}
function renderQuestion() {
const q = selectedQuestions[currentIdx];
const progress = ((currentIdx) / 10) * 100;
document.getElementById('progress-fill').style.width = progress + '%';
document.querySelector('.progress-container').setAttribute('aria-valuenow', progress);
const content = document.getElementById('question-content');
content.innerHTML = '<div class="animate-fade"><span class="question-tag">سوال ' + (currentIdx + 1) + ' از ۱۰</span><h2 class="question-text">' + q.q + '</h2><div class="options-list">' + q.o.map(function(opt, i) { return '<div class="option-item" onclick="selectOption(' + i + ')" role="button" tabindex="0" aria-label="گزینه ' + (i + 1) + '">' + opt + '</div>'; }).join('') + '</div></div>';
document.getElementById('nextBtn').disabled = true;
selectedAnswer = null;
}
function selectOption(idx) {
selectedAnswer = idx;
const options = document.querySelectorAll('.option-item');
options.forEach(function(opt, i) {
opt.classList.toggle('selected', i === idx);
});
document.getElementById('nextBtn').disabled = false;
}
function handleNext() {
if (selectedAnswer === selectedQuestions[currentIdx].c) {
score++;
}
currentIdx++;
if (currentIdx < 10) {
renderQuestion();
} else {
showResults();
}
}
function showResults() {
document.getElementById('quiz-screen').style.display = 'none';
document.getElementById('result-screen').style.display = 'block';
const percentage = (score / 10) * 100;
document.getElementById('final-score').innerText = percentage + '%';
const text = document.getElementById('result-text');
if (score >= 8) {
text.innerText = 'فوق‌العاده! شما یک هوشمند نمای واقعی هستید و تسلط کاملی بر امنیت دیجیتال دارید.';
} else if (score >= 5) {
text.innerText = 'خوب بود! اطلاعات پایه را دارید، اما برای امنیت بیشتر پیشنهاد می‌کنیم آموزش‌های ما را دوباره مرور کنید.';
} else {
text.innerText = 'نیاز به آموزش بیشتر! فضای مجازی چالش‌های زیادی دارد. پیشنهاد می‌کنیم دوره را از ابتدا با دقت ببینید.';
}
}
