<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پخش ویدیو | هوشمند نما</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        :root {
            --primary: #bc6c4d;
            --primary-light: #f4ece6;
            --text-dark: #4a4441;
            --text-gray: #7a7471;
            --bg: #f9f7f2;
            --border: #e2ddd9;
            --radius: 16px;
        }

        body.dark-mode {
            --primary: #d4a373;
            --primary-light: #3d3532;
            --text-dark: #f1ebe7;
            --text-gray: #b5ada8;
            --bg: #1c1917;
            --border: #44403c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text-dark);
            transition: background-color 0.4s ease;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 20px;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-weight: 900;
            font-size: 1.5rem;
            color: var(--primary);
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            border: 1px solid var(--border);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
            background: var(--bg);
            cursor: pointer;
            text-decoration: none;
        }

        .container {
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        .video-wrapper {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        video {
            width: 100%;
            height: 100%;
            display: block;
        }

        .video-info-card {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
        }

        .video-info-card h1 {
            font-size: 1.3rem;
            font-weight: 900;
            color: var(--primary);
            margin-bottom: 12px;
        }

        .video-info-card p {
            font-size: 0.95rem;
            line-height: 1.8;
            color: var(--text-dark);
            text-align: justify;
        }

        .action-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 25px;
        }

        .btn-play {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px;
            background: var(--primary-light);
            color: var(--primary);
            border-radius: 12px;
            text-decoration: none;
            font-weight: 800;
            font-size: 0.9rem;
            transition: 0.3s;
            border: 1px solid transparent;
        }

        .btn-play:hover {
            background: var(--primary);
            color: white;
        }
    </style>
</head>
<body>

    <header>
        <a href="videos.html" class="icon-btn" style="border:none;">
            <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2.5" fill="none">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
        </a>
        <div class="logo">پخش آموزش</div>
        <div class="icon-btn" id="themeToggle">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
        </div>
    </header>

    <main class="container">
        <div class="video-wrapper">
            <video controls poster="thumb.jpg">
                <source src="lesson.mp4" type="video/mp4">
                مرورگر شما از ویدیو پشتیبانی نمی‌کند.
            </video>
        </div>

        <div class="video-info-card">
            <h1>عنوان جلسه آموزشی</h1>
            <p>توضیحات مربوط به این ویدیو در این قسمت قرار می‌گیرد. شما می‌توانید جزئیات مربوط به مباحث سواد رسانه و امنیت سایبری این جلسه را در اینجا مطالعه کنید.</p>
            
            <div class="action-area">
                <a href="question.html" class="btn-play">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2.5" fill="none"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                    شرکت در آزمون
                </a>
                <a href="#" class="btn-play">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2.5" fill="none"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                    دانلود منابع
                </a>
            </div>
        </div>
    </main>

    <script>
        const body = document.body;
        const toggle = document.getElementById('themeToggle');
        
        toggle.addEventListener('click', () => {
            body.classList.toggle('dark-mode');
        });
    </script>
</body>
</html>
