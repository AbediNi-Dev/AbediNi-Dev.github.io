<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سرفصل‌های آموزشی | هوشمند نما</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        :root {
            --primary: #bc6c4d;
            --primary-light: #f4ece6;
            --text-dark: #4a4441;
            --text-gray: #7a7471;
            --bg: #f9f7f2;
            --border: #e2ddd9;
            --radius: 16px;
        }
        body.dark-mode {
            --primary: #d4a373;
            --primary-light: #3d3532;
            --text-dark: #f1ebe7;
            --text-gray: #b5ada8;
            --bg: #1c1917;
            --border: #44403c;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: var(--bg);
            color: var(--text-dark);
            line-height: 1.6;
            padding-bottom: 40px;
            transition: background-color 0.4s ease, color 0.4s ease;
        }
        header {
            background: var(--bg);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border);
        }
        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 20px;
        }
        .logo {
            font-weight: 900;
            font-size: 1.5rem;
            color: var(--primary);
        }
        .icon-btn {
            width: 40px;
            height: 40px;
            border: 1px solid var(--border);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            cursor: pointer;
            color: var(--primary);
        }
        .search-container {
            padding: 0 20px 15px;
            display: none;
        }
        .search-input {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--primary);
            border-radius: 12px;
            outline: none;
            background: var(--primary-light);
            color: var(--text-dark);
        }
        .main-container {
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .hero-banner {
            width: 100%;
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 25px;
            aspect-ratio: 16 / 9;
            background: var(--primary-light);
            border: 1px solid var(--border);
        }
        .hero-banner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .phase-title {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--primary);
            margin: 30px 0 15px 0;
            padding: 10px;
            border-right: 4px solid var(--primary);
            background-color: var(--primary-light);
            border-radius: 8px;
        }
        .video-item {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin-bottom: 12px;
            overflow: hidden;
            transition: 0.3s;
        }
        .video-item.active {
            border-color: var(--primary);
            box-shadow: 0 4px 15px rgba(188, 108, 77, 0.1);
        }
        .video-header {
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
        }
        .play-icon {
            width: 36px;
            height: 36px;
            background: var(--primary);
            color: white;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .video-summary {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease;
            background-color: var(--primary-light);
        }
        .summary-inner {
            padding: 15px;
            font-size: 0.9rem;
            border-top: 1px solid var(--border);
        }
        .action-btn {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 20px;
            background: var(--primary);
            color: #fff;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
        }
        svg { fill: none; stroke: currentColor; stroke-width: 2.5; }
    </style>
</head>
<body>
    <header>
        <div class="header-top">
            <a href="index.html" class="icon-btn" style="border:none;">
                <svg viewBox="0 0 24 24" width="24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            </a>
            <div class="logo">هوشمند نما</div>
            <div class="header-right" style="display:flex; gap:10px;">
                <div class="icon-btn" onclick="toggleSearch()">
                    <svg viewBox="0 0 24 24" width="20"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                </div>
                <div class="icon-btn" id="themeToggle">
                    <svg class="moon-icon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                    <svg class="sun-icon" viewBox="0 0 24 24" style="display:none;"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
                </div>
            </div>
        </div>
        <div class="search-container" id="searchBox">
            <input type="text" class="search-input" id="searchInput" placeholder="جستجوی در مباحث..." onkeyup="liveSearch()">
        </div>
    </header>

    <main class="main-container">
        <div class="hero-banner">
            <img src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?q=80&w=1000" alt="سرفصل‌ها">
        </div>
        <div id="course-list"></div>
    </main>

    <script>
        const phases = [
            {
                title: "فاز اول: سواد رسانه و تفکر انتقادی",
                episodes: [
                    { title: "مفهوم رسانه و پیام‌های پنهان", summary: "آشنایی با لایه‌های زیرین تولیدات رسانه‌ای." },
                    { title: "تکنیک‌های زرد نویسی و دام کلیک", summary: "چگونه عناوین فریبنده ما را جذب می‌کنند؟" },
                    { title: "عملکرد الگوریتم‌های پیشنهاد دهنده", summary: "چرا محتواهای خاصی را در اکسپلور می‌بینیم؟" },
                    { title: "راستی‌آزمایی اخبار در یک دقیقه", summary: "جعبه ابزار تشخیص اخبار جعلی از واقعی." },
                    { title: "جستجوی معکوس و اعتبار سنجی عکس", summary: "شناسایی تصاویر دستکاری شده و فتوشاپ." },
                    { title: "ردپای دیجیتال و برندینگ شخصی", summary: "تأثیر فعالیت‌های آنلاین بر آینده شغلی." }
                ]
            },
            {
                title: "فاز دوم: امنیت دیجیتال و صیانت",
                episodes: [
                    { title: "مهندسی گذرواژه‌های نفوذ ناپذیر", summary: "اصول طراحی پسوردهای امن و مدیریت آن‌ها." },
                    { title: "فعالسازی لایه‌های امنیتی 2FA", summary: "آموزش گام به گام تایید دو مرحله‌ای." },
                    { title: "آناتومی لینک‌های آلوده و فیشینگ", summary: "شناسایی درگاه‌های پرداخت جعلی." },
                    { title: "مدیریت دسترسی اپلیکیشن‌ها", summary: "کدام برنامه‌ها جاسوسی ما را می‌کنند؟" },
                    { title: "امنیت در شبکه‌های وای‌فای عمومی", summary: "خطرات اتصال به اینترنت رایگان در اماکن عمومی." },
                    { title: "پیشگیری از هک و نفوذ به اکانت", summary: "روش‌های مقابله با بدافزارها و رات‌ها." }
                ]
            },
            {
                title: "فاز سوم: تکنولوژی‌های نوظهور و اخلاق",
                episodes: [
                    { title: "شناخت تصاویر ساخته شده با AI", summary: "نشانه‌های بصری برای تشخیص کارهای هوش مصنوعی." },
                    { title: "دیپ فیک؛ جعل واقعیت", summary: "خطر ویدئوهای جعلی و نحوه تشخیص آن‌ها." },
                    { title: "پرسشگری انتقادی در فضای مجازی", summary: "چگونه هر چیزی را به راحتی باور نکنیم؟" },
                    { title: "مقابله با قلدری و آزار سایبری", summary: "روش‌های برخورد با ترول‌ها و مزاحمان آنلاین." },
                    { title: "حقوق مولف و کپی رایت دیجیتال", summary: "قوانین استفاده از محتوای دیگران." },
                    { title: "مسئولیت اجتماعی شهروند دیجیتال", summary: "اخلاق حرفه‌ای در تعاملات فضای مجازی." }
                ]
            }
        ];

        const container = document.getElementById('course-list');
        let counter = 1;

        phases.forEach(phase => {
            const h2 = document.createElement('h2');
            h2.className = 'phase-title';
            h2.textContent = phase.title;
            container.appendChild(h2);

            phase.episodes.forEach(ep => {
                const div = document.createElement('div');
                div.className = 'video-item';
                div.innerHTML = `
                    <div class="video-header" onclick="toggleItem(this)">
                        <div style="display:flex; align-items:center; gap:12px;">
                            <div class="play-icon"><svg viewBox="0 0 24 24" width="18" stroke="white"><polygon points="5 3 19 12 5 21 5 3" fill="white"/></svg></div>
                            <div>
                                <h3 class="title-text">${ep.title}</h3>
                                <small style="color:var(--text-gray)">جلسه ${counter++}</small>
                            </div>
                        </div>
                    </div>
                    <div class="video-summary">
                        <div class="summary-inner">
                            <p>${ep.summary}</p>
                            <a href="player.html" class="action-btn">مشاهده ویدیو</a>
                        </div>
                    </div>`;
                container.appendChild(div);
            });
        });

        function toggleSearch() {
            const box = document.getElementById('searchBox');
            box.style.display = box.style.display === 'block' ? 'none' : 'block';
        }

        function liveSearch() {
            const val = document.getElementById('searchInput').value.toLowerCase();
            const items = document.querySelectorAll('.video-item');
            items.forEach(item => {
                const text = item.querySelector('.title-text').textContent.toLowerCase();
                item.style.display = text.includes(val) ? 'block' : 'none';
            });
        }

        function toggleItem(el) {
            const parent = el.parentElement;
            const content = parent.querySelector('.video-summary');
            const isActive = parent.classList.contains('active');
            document.querySelectorAll('.video-item').forEach(i => {
                i.classList.remove('active');
                i.querySelector('.video-summary').style.maxHeight = null;
            });
            if (!isActive) {
                parent.classList.add('active');
                content.style.maxHeight = content.scrollHeight + "px";
            }
        }

        const toggle = document.getElementById('themeToggle');
        toggle.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            toggle.querySelector('.moon-icon').style.display = isDark ? 'none' : 'block';
            toggle.querySelector('.sun-icon').style.display = isDark ? 'block' : 'none';
        });
    </script>
</body>
</html>
