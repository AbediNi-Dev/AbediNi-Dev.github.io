div.innerHTML = '<div class="video-header" onclick="toggleItem(this)" role="button" tabindex="0" aria-expanded="false"><div style="display:flex; align-items:center; gap:18px;"><div class="play-icon" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg></div><div><h3 class="title-text" style="font-size:1rem; font-weight:800;">' + ep.title + '</h3><small style="color:var(--text-gray); font-weight:bold;">جلسه ' + sessionCounter++ + '</small></div></div><svg class="chevron" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="transition:0.4s"><path d="M6 9l6 6 6-6"/></svg></div><div class="video-summary"><div class="summary-inner"><p>' + ep.summary + '</p><a href="' + ep.video + '" class="action-btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>مشاهده درس</a></div></div>';

const htmlEl = document.documentElement;
const themeToggle = document.getElementById('themeToggle');
const moonIcon = document.querySelector('.moon-icon');
const sunIcon = document.querySelector('.sun-icon');
const themeColorMeta = document.getElementById('themeColor');
const saved = localStorage.getItem('theme');
const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
let isDark = saved === 'dark' || (!saved && prefersDark);
function applyTheme(dark) {
if (dark) {
htmlEl.classList.add('dark');
htmlEl.classList.remove('light');
moonIcon.classList.add('hidden');
sunIcon.classList.remove('hidden');
sunIcon.classList.add('block');
if (themeColorMeta) themeColorMeta.content = '#d4a373';
themeToggle.setAttribute('aria-label', 'فعال‌سازی حالت روز');
} else {
htmlEl.classList.remove('dark');
htmlEl.classList.add('light');
moonIcon.classList.remove('hidden');
sunIcon.classList.add('hidden');
sunIcon.classList.remove('block');
if (themeColorMeta) themeColorMeta.content = '#bc6c4d';
themeToggle.setAttribute('aria-label', 'فعال‌سازی حالت شب');
}
}
applyTheme(isDark);
themeToggle.addEventListener('click', function () {
isDark = !isDark;
localStorage.setItem('theme', isDark ? 'dark' : 'light');
applyTheme(isDark);
});
function toggleSearch() {
const box = document.getElementById('searchBox');
box.style.display = box.style.display === 'block' ? 'none' : 'block';
if(box.style.display === 'block') document.getElementById('searchInput').focus();
}
function liveSearch() {
const val = document.getElementById('searchInput').value.toLowerCase();
const items = document.querySelectorAll('.video-item');
const phases = document.querySelectorAll('.phase-title');
items.forEach(function(item) {
const text = item.querySelector('.title-text').textContent.toLowerCase();
item.style.display = text.includes(val) ? 'block' : 'none';
});
phases.forEach(function(phase) {
let next = phase.nextElementSibling;
let visible = false;
while(next && next.classList.contains('video-item')) {
if(next.style.display === 'block') visible = true;
next = next.nextElementSibling;
}
phase.style.display = visible ? 'block' : 'none';
});
}
function toggleItem(el) {
const parent = el.parentElement;
const content = parent.querySelector('.video-summary');
const chevron = el.querySelector('.chevron');
const isActive = parent.classList.contains('active');
document.querySelectorAll('.video-item').forEach(function(i) {
i.classList.remove('active');
i.querySelector('.video-summary').style.maxHeight = null;
i.querySelector('.chevron').style.transform = 'rotate(0deg)';
i.querySelector('.video-header').setAttribute('aria-expanded', 'false');
});
if (!isActive) {
parent.classList.add('active');
content.style.maxHeight = content.scrollHeight + "px";
chevron.style.transform = 'rotate(180deg)';
el.setAttribute('aria-expanded', 'true');
}
}
document.querySelectorAll('.video-header').forEach(function(header) {
header.addEventListener('keydown', function(e) {
if (e.key === 'Enter' || e.key === ' ') {
e.preventDefault();
toggleItem(this);
}
});
});
</script>
