<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta id="theme-color-meta" name="theme-color" content="#bc6c4d">
    <title>سرفصل‌های آموزشی | هوشمند نما</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        :root {
            --primary: #bc6c4d;
            --primary-hover: #a05a3e;
            --primary-light: #f4ece6;
            --text-dark: #2d2a28;
            --text-gray: #5e5855;
            --bg: #fdfcfb;
            --border: #e8e3e0;
            --shadow: 0 10px 30px -10px rgba(188, 108, 77, 0.15);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --radius: 18px;
        }
        body.dark-mode {
            --primary: #d4a373;
            --primary-hover: #e5b88b;
            --primary-light: #2d2623;
            --text-dark: #f8f1ed;
            --text-gray: #b0a6a0;
            --bg: #12100f;
            --border: #332d2a;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: var(--bg);
            color: var(--text-dark);
            line-height: 1.7;
            transition: var(--transition);
            padding-bottom: 50px;
        }
        header {
            background: var(--bg);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(10px);
        }
        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 5%;
        }
        .logo {
            font-weight: 900;
            font-size: 1.5rem;
            color: var(--primary);
        }
        .icon-btn {
            width: 42px;
            height: 42px;
            border: 1px solid var(--border);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            cursor: pointer;
            transition: var(--transition);
            color: var(--text-dark);
            text-decoration: none;
        }
        .icon-btn:hover {
            border-color: var(--primary);
            background: var(--primary-light);
        }
        .search-container {
            padding: 0 5% 15px;
            display: none;
            animation: fadeInDown 0.3s ease;
        }
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .search-input {
            width: 100%;
            padding: 14px 20px;
            border: 2px solid var(--primary);
            border-radius: 15px;
            outline: none;
            background: var(--bg);
            color: var(--text-dark);
            font-weight: 600;
            font-size: 0.95rem;
        }
        .main-container {
            padding: 30px 5%;
            max-width: 850px;
            margin: 0 auto;
        }
        .hero-banner {
            width: 100%;
            border-radius: 28px;
            overflow: hidden;
            margin-bottom: 35px;
            aspect-ratio: 21 / 9;
            background: var(--primary-light);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }
        .hero-banner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .phase-title {
            font-size: 1.15rem;
            font-weight: 900;
            color: var(--primary);
            margin: 40px 0 15px 0;
            padding: 14px 20px;
            border-right: 5px solid var(--primary);
            background-color: var(--primary-light);
            border-radius: 12px;
        }
        .video-item {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin-bottom: 15px;
            overflow: hidden;
            transition: var(--transition);
        }
        .video-item.active {
            border-color: var(--primary);
            box-shadow: 0 10px 25px -5px rgba(188, 108, 77, 0.15);
        }
        .video-header {
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
        }
        .play-icon {
            width: 45px;
            height: 45px;
            background: var(--primary);
            color: white;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
        }
        .video-item:hover .play-icon {
            transform: scale(1.1) rotate(5deg);
        }
        .video-summary {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            background-color: var(--primary-light);
        }
        .summary-inner {
            padding: 25px;
            font-size: 0.95rem;
            border-top: 1px solid var(--border);
        }
        .summary-inner p {
            margin-bottom: 20px;
            color: var(--text-dark);
            line-height: 1.8;
        }
        .action-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 28px;
            background: var(--primary);
            color: #fff;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 800;
            transition: var(--transition);
            border: none;
        }
        .action-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(188, 108, 77, 0.3);
        }
        footer {
            padding: 30px;
            text-align: center;
            border-top: 1px solid var(--border);
            font-size: 0.85rem;
            color: var(--text-gray);
        }
    </style>
</head>
<body>
    <header>
        <div class="header-top">
            <a href="index.html" class="icon-btn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            </a>
            <div class="logo">هوشمند نما</div>
            <div style="display:flex; gap:10px;">
                <div class="icon-btn" onclick="toggleSearch()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                </div>
                <div class="icon-btn" id="themeToggle">
                    <svg class="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                    <svg class="sun-icon" style="display:none" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
                </div>
            </div>
        </div>
        <div class="search-container" id="searchBox">
            <input type="text" class="search-input" id="searchInput" placeholder="نام درس را جستجو کنید..." onkeyup="liveSearch()">
        </div>
    </header>
    <main class="main-container">
        <div class="hero-banner">
            <img src="https://images.unsplash.com/photo-1516321318423-f06f85e504b3?q=80&w=1200" alt="Banner">
        </div>
        <div id="course-list"></div>
    </main>
    <footer>یازدهمین جشنواره نوجوان خوارزمی | محور برنامه‌نویسی</footer>
    <script>
        const phases = [
            {
                title: "فاز اول: سواد رسانه و تفکر انتقادی",
                episodes: [
                    { title: "مفهوم رسانه و پیام‌های پنهان", summary: "در این جلسه یاد می‌گیریم که چگونه لایه‌های زیرین و اهداف تولیدکنندگان پیام‌های رسانه‌ای را کشف کنیم." },
                    { title: "تکنیک‌های زرد نویسی و دام کلیک", summary: "چرا روی برخی خبرها کلیک می‌کنیم؟ بررسی روانشناختی عناوین فریبنده و راه‌های مقابله با آن‌ها." },
                    { title: "عملکرد الگوریتم‌های پیشنهاد دهنده", summary: "تحلیل نحوه کارکرد شبکه‌های اجتماعی در نمایش محتواهای شخصی‌سازی شده و حبابی." },
                    { title: "راستی‌آزمایی اخبار در یک دقیقه", summary: "معرفی ابزارهای سریع و تکنیک‌های چک کردن منابع برای تشخیص شایعه از واقعیت." },
                    { title: "جستجوی معکوس و اعتبار سنجی عکس", summary: "چگونه بفهمیم یک عکس واقعاً مربوط به کجاست و آیا با هوش مصنوعی ساخته شده یا خیر؟" },
                    { title: "ردپای دیجیتال و برندینگ شخصی", summary: "هر لایک و کامنت شما شناسنامه دیجیتال شماست. یاد بگیرید چگونه آن را مدیریت کنید." }
                ]
            },
            {
                title: "فاز دوم: امنیت دیجیتال و صیانت",
                episodes: [
                    { title: "مهندسی گذرواژه‌های نفوذ ناپذیر", summary: "روش‌های نوین برای ساخت رمزهای عبوری که حتی ابرکامپیوترها هم از پس آن بر نیایند." },
                    { title: "فعالسازی لایه‌های امنیتی 2FA", summary: "آموزش گام به گام فعالسازی تایید دو مرحله‌ای در تلگرام، اینستاگرام و ایمیل." },
                    { title: "آناتومی لینک‌های آلوده و فیشینگ", summary: "بررسی پیامک‌های جعلی ابلاغیه، سهام عدالت و روش‌های شناسایی درگاه‌های بانکی تقلبی." },
                    { title: "مدیریت دسترسی اپلیکیشن‌ها", summary: "چرا یک اپلیکیشن چراغ‌قوه به گالری و میکروفون شما نیاز دارد؟ بررسی حریم خصوصی." },
                    { title: "امنیت در شبکه‌های وای‌فای عمومی", summary: "خطرات استفاده از وای‌فای رایگان و راه‌های محافظت از داده‌ها در محیط‌های عمومی." },
                    { title: "پیشگیری از هک و نفوذ به اکانت", summary: "اگر هک شدیم چه کنیم؟ علائم نفوذ و اولین اقدامات اضطراری برای بازیابی امنیت." }
                ]
            },
            {
                title: "فاز سوم: تکنولوژی‌های نوظهور و اخلاق",
                episodes: [
                    { title: "شناخت تصاویر ساخته شده با AI", summary: "بررسی سوتی‌های هوش مصنوعی در تولید تصویر و راه‌های تشخیص واقعیت." },
                    { title: "دیپ فیک؛ جعل واقعیت", summary: "وقتی ویدئوها دروغ می‌گویند؛ آشنایی با جعل عمیق چهره و صدا و خطرات آن." },
                    { title: "پرسشگری انتقادی در فضای مجازی", summary: "تقویت ماهیچه شک و پرسشگری قبل از لایک یا اشتراک‌گذاری هر محتوایی." },
                    { title: "مقابله با قلدری و آزار سایبری", summary: "چگونه در برابر ترول‌ها و آزارهای آنلاین بایستیم و سلامت روان خود را حفظ کنیم؟" },
                    { title: "حقوق مولف و کپی رایت دیجیتال", summary: "اخلاق در استفاده از آثار دیگران و آشنایی با قوانین مالکیت معنوی در وب." },
                    { title: "مسئولیت اجتماعی شهروند دیجیتال", summary: "چگونه به عنوان یک کاربر بالغ، تاثیر مثبتی بر جامعه آنلاین خود داشته باشیم؟" }
                ]
            }
        ];
        const container = document.getElementById('course-list');
        let sessionCounter = 1;
        phases.forEach(phase => {
            const h2 = document.createElement('h2');
            h2.className = 'phase-title';
            h2.textContent = phase.title;
            container.appendChild(h2);
            phase.episodes.forEach(ep => {
                const div = document.createElement('div');
                div.className = 'video-item';
                div.innerHTML = `
                    <div class="video-header" onclick="toggleItem(this)">
                        <div style="display:flex; align-items:center; gap:18px;">
                            <div class="play-icon">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                            </div>
                            <div>
                                <h3 class="title-text" style="font-size:1rem; font-weight:800;">${ep.title}</h3>
                                <small style="color:var(--text-gray); font-weight:bold;">جلسه ${sessionCounter++}</small>
                            </div>
                        </div>
                        <svg class="chevron" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="transition:0.4s"><path d="M6 9l6 6 6-6"/></svg>
                    </div>
                    <div class="video-summary">
                        <div class="summary-inner">
                            <p>${ep.summary}</p>
                            <a href="player.html" class="action-btn">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                                مشاهده درس
                            </a>
                        </div>
                    </div>`;
                container.appendChild(div);
            });
        });
        const body = document.body;
        const themeBtn = document.getElementById('themeToggle');
        const moon = themeBtn.querySelector('.moon-icon');
        const sun = themeBtn.querySelector('.sun-icon');
        function updateTheme(isDark) {
            if (isDark) {
                body.classList.add('dark-mode');
                moon.style.display = 'none';
                sun.style.display = 'block';
                localStorage.setItem('theme', 'dark');
            } else {
                body.classList.remove('dark-mode');
                moon.style.display = 'block';
                sun.style.display = 'none';
                localStorage.setItem('theme', 'light');
            }
        }
        if (localStorage.getItem('theme') === 'dark') updateTheme(true);
        themeBtn.onclick = () => updateTheme(!body.classList.contains('dark-mode'));
        function toggleSearch() {
            const box = document.getElementById('searchBox');
            box.style.display = box.style.display === 'block' ? 'none' : 'block';
            if(box.style.display === 'block') document.getElementById('searchInput').focus();
        }
        function liveSearch() {
            const val = document.getElementById('searchInput').value.toLowerCase();
            const items = document.querySelectorAll('.video-item');
            const phases = document.querySelectorAll('.phase-title');
            items.forEach(item => {
                const text = item.querySelector('.title-text').textContent.toLowerCase();
                item.style.display = text.includes(val) ? 'block' : 'none';
            });
            phases.forEach(phase => {
                let next = phase.nextElementSibling;
                let visible = false;
                while(next && next.classList.contains('video-item')) {
                    if(next.style.display === 'block') visible = true;
                    next = next.nextElementSibling;
                }
                phase.style.display = visible ? 'block' : 'none';
            });
        }
        function toggleItem(el) {
            const parent = el.parentElement;
            const content = parent.querySelector('.video-summary');
            const chevron = el.querySelector('.chevron');
            const isActive = parent.classList.contains('active');
            document.querySelectorAll('.video-item').forEach(i => {
                i.classList.remove('active');
                i.querySelector('.video-summary').style.maxHeight = null;
                i.querySelector('.chevron').style.transform = 'rotate(0deg)';
            });
            if (!isActive) {
                parent.classList.add('active');
                content.style.maxHeight = content.scrollHeight + "px";
                chevron.style.transform = 'rotate(180deg)';
            }
        }
    </script>
</body>
</html>
