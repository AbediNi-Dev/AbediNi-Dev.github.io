<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>هوشمند نما | پلتفرم تخصصی ارتقای سواد رسانه‌ای</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        :root {
            /* پالت رنگی استخراج شده از تصویر ارسالی */
            --primary: #bc6c4d; /* آجری/قهوه‌ای گرم دکمه‌ها */
            --primary-light: #f4ece6; /* کرم روشن پس‌زمینه کارت‌ها */
            --text-dark: #4a4441; /* خاکستری تیره مایل به قهوه‌ای برای متون */
            --text-gray: #7a7471; 
            --bg: #f9f7f2; /* رنگ پس‌زمینه اصلی (استخوانی/کرم) */
            --border: #e2ddd9;
            --radius: 12px;
        }

        body.dark-mode {
            --primary: #d4a373;
            --primary-light: #3d3532;
            --text-dark: #f1ebe7;
            --text-gray: #b5ada8;
            --bg: #1c1917;
            --border: #44403c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text-dark);
            line-height: 1.6;
            padding-bottom: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 5%;
            background: var(--bg);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border);
        }

        .logo {
            font-weight: 900;
            font-size: 1.5rem;
            color: var(--text-dark);
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            border: 1px solid var(--border);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
            cursor: pointer;
            background: transparent;
        }

        .hero { padding: 40px 5%; text-align: center; }

        .hero-banner {
            width: 100%;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 30px;
            border: 1px solid var(--border);
        }

        .hero h1 {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--text-dark);
            margin-bottom: 15px;
        }

        .btn {
            padding: 12px 25px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
            border: none;
        }

        .btn-primary:hover { opacity: 0.9; transform: translateY(-2px); }

        .btn-secondary {
            background-color: var(--primary-light);
            color: var(--primary);
            border: 1px solid var(--border);
        }

        .stats-row {
            display: flex;
            justify-content: space-around;
            padding: 30px 0;
            margin: 40px 0;
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            background: rgba(188, 108, 77, 0.03);
        }

        .stat-num { color: var(--primary); font-weight: 800; font-size: 1.2rem; }

        .categories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            padding: 20px 5%;
        }

        .cat-card {
            background: var(--primary-light);
            border: 1px solid var(--border);
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            transition: 0.3s;
        }

        .cat-card:hover { transform: translateY(-5px); border-color: var(--primary); }

        .cat-icon { color: var(--primary); width: 35px; height: 35px; margin: 0 auto 15px; }

        .feature-item {
            display: flex;
            align-items: center;
            padding: 15px;
            background: white;
            margin-bottom: 10px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }

        .check-icon { background: var(--primary); color: white; border-radius: 50%; padding: 3px; width: 20px; height: 20px; margin-left: 10px;}

        footer {
            margin-top: 50px;
            padding: 30px;
            text-align: center;
            background: var(--primary-light);
            color: var(--text-gray);
        }

        svg { fill: none; stroke: currentColor; stroke-width: 2.5; }
    </style>
</head>
<body>

<header>
    <div class="logo">هوشمند نما</div>
    <div class="header-left">
        <div class="icon-btn" id="themeToggle">
            <svg class="moon-icon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            <svg class="sun-icon" style="display:none" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        </div>
    </div>
</header>

<main>
    <section class="hero">
        <div class="hero-banner">
            <img src="https://images.unsplash.com/photo-1563986768609-322da13575f3?auto=format&fit=crop&q=80&w=1200" alt="سواد رسانه‌ای" style="width:100%">
        </div>
        <h1>هوشمندانه در فضای مجازی حضور یابید</h1>
        <p>ارتقای سواد رسانه‌ای و امنیت سایبری با متدهای نوین آموزشی</p>
        
        <div style="margin: 30px 0; display: flex; gap: 10px; justify-content: center;">
            <a href="#" class="btn btn-primary">مشاهده دوره‌ها</a>
            <a href="#" class="btn btn-secondary">سنجش دانش</a>
        </div>

        <div class="stats-row">
            <div class="stat-item">
                <span class="stat-num">۱۸</span>
                <div style="font-size: 0.8rem;">جلسه آموزشی</div>
            </div>
            <div class="stat-item">
                <span class="stat-num">۲۰۴</span>
                <div style="font-size: 0.8rem;">دانش‌آموز فعال</div>
            </div>
        </div>
    </section>

    <div class="categories-grid">
        <div class="cat-card">
            <div class="cat-icon"><svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></div>
            <div style="font-weight: bold;">امنیت حساب‌ها</div>
        </div>
        <div class="cat-card">
            <div class="cat-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg></div>
            <div style="font-weight: bold;">تفکر انتقادی</div>
        </div>
    </div>
</main>

<footer>
    <p>تمامی حقوق متعلق به امیرمهدی عابدینی است.</p>
</footer>

<script>
    const toggle = document.getElementById('themeToggle');
    const moon = toggle.querySelector('.moon-icon');
    const sun = toggle.querySelector('.sun-icon');
    
    toggle.addEventListener('click', () => {
        document.body.classList.toggle('dark-mode');
        const isDark = document.body.classList.contains('dark-mode');
        moon.style.display = isDark ? 'none' : 'block';
        sun.style.display = isDark ? 'block' : 'none';
    });
</script>
</body>
</html>
